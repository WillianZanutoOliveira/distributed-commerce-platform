  orders-api:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      ConnectionStrings__orders-db: ""
      RabbitMq__Username: ""
      RabbitMq__Password: ""
      Vault__Address: "http://vault:8200"
      Vault__TokenFile: "/run/vault/token"
