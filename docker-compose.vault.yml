      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      ConnectionStrings__products-db: ""
      Vault__Address: "http://vault:8200"
      Vault__TokenFile: "/run/vault/token"
      Vault__DatabaseRole: "products-migration"
      Vault__DatabaseConnectionStringName: "products-db"
      Vault__DatabaseHost: "products-db"
      Vault__DatabasePort: "5432"
      Vault__DatabaseName: "products"
      Vault__DatabaseRuntimeRole: "products_migrator"
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-products-migrator-token:/run/vault:ro

  api-gateway:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

  products-api:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      ConnectionStrings__products-db: ""
      Vault__Address: "http://vault:8200"
      Vault__TokenFile: "/run/vault/token"
      Vault__DatabaseRole: "products-app"
      Vault__DatabaseConnectionStringName: "products-db"
      Vault__DatabaseHost: "products-db"
      Vault__DatabasePort: "5432"
      Vault__DatabaseName: "products"
      Vault__DatabaseRuntimeRole: "products_runtime"
      Vault__LeaseRenewalIntervalSeconds: "5"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      products-migrator:
        condition: service_completed_successfully
    volumes:
      - vault-products-token:/run/vault:ro

  customers-api:
