services:
  vault:
    image: hashicorp/vault:1.21.4
    command: ["server", "-dev"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "8200:8200"

  vault-init:
    image: hashicorp/vault:1.21.4
    entrypoint: ["/bin/sh", "/bootstrap/vault-init.sh"]
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      VAULT_TOKEN_FILE_OWNER: "1654:1654"
    depends_on:
      vault:
        condition: service_healthy
      orders-db:
        condition: service_healthy
      inventory-db:
        condition: service_healthy
      payments-db:
        condition: service_healthy
      customers-db:
        condition: service_healthy
      products-db:
        condition: service_healthy
    volumes:
      - ./deploy/vault/vault-init.sh:/bootstrap/vault-init.sh:ro
      - vault-orders-token:/tokens/orders
      - vault-inventory-token:/tokens/inventory
      - vault-payments-token:/tokens/payments
      - vault-notifications-token:/tokens/notifications
      - vault-orders-migrator-token:/tokens/orders-migrator
      - vault-inventory-migrator-token:/tokens/inventory-migrator
      - vault-payments-migrator-token:/tokens/payments-migrator
      - vault-customers-token:/tokens/customers
      - vault-customers-migrator-token:/tokens/customers-migrator
      - vault-products-token:/tokens/products
      - vault-products-migrator-token:/tokens/products-migrator

  orders-db:
    volumes:
      - ./deploy/postgres/orders-init.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro

  inventory-db:
    volumes:
      - ./deploy/postgres/inventory-init.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro

  payments-db:
    volumes:
      - ./deploy/postgres/payments-init.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro

  customers-db:
    volumes:
      - ./deploy/postgres/customers-init.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro

  products-db:
    volumes:
      - ./deploy/postgres/products-init.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro

  orders-migrator:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      ConnectionStrings__orders-db: ""
      Vault__Address: "http://vault:8200"
      Vault__TokenFile: "/run/vault/token"
      Vault__DatabaseRole: "orders-migration"
      Vault__DatabaseConnectionStringName: "orders-db"
      Vault__DatabaseHost: "orders-db"
      Vault__DatabasePort: "5432"
      Vault__DatabaseName: "orders"
      Vault__DatabaseRuntimeRole: "orders_migrator"
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-orders-migrator-token:/run/vault:ro

  inventory-migrator:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      ConnectionStrings__inventory-db: ""
      Vault__Address: "http://vault:8200"
      Vault__TokenFile: "/run/vault/token"
      Vault__DatabaseRole: "inventory-migration"
      Vault__DatabaseConnectionStringName: "inventory-db"
      Vault__DatabaseHost: "inventory-db"
      Vault__DatabasePort: "5432"
      Vault__DatabaseName: "inventory"
      Vault__DatabaseRuntimeRole: "inventory_migrator"
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-inventory-migrator-token:/run/vault:ro

  payments-migrator:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      ConnectionStrings__payments-db: ""
      Vault__Address: "http://vault:8200"
      Vault__TokenFile: "/run/vault/token"
      Vault__DatabaseRole: "payments-migration"
      Vault__DatabaseConnectionStringName: "payments-db"
      Vault__DatabaseHost: "payments-db"
      Vault__DatabasePort: "5432"
      Vault__DatabaseName: "payments"
      Vault__DatabaseRuntimeRole: "payments_migrator"
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-payments-migrator-token:/run/vault:ro

  customers-migrator:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      ConnectionStrings__customers-db: ""
      Vault__Address: "http://vault:8200"
      Vault__TokenFile: "/run/vault/token"
      Vault__DatabaseRole: "customers-migration"
      Vault__DatabaseConnectionStringName: "customers-db"
      Vault__DatabaseHost: "customers-db"
      Vault__DatabasePort: "5432"
      Vault__DatabaseName: "customers"
      Vault__DatabaseRuntimeRole: "customers_migrator"
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-customers-migrator-token:/run/vault:ro

  products-migrator:
